            - img "Google Antigravity SDK" [ref=e84]
            - generic [ref=e85]:
              - paragraph [ref=e88]:
                - text: Today we are launching the Google Antigravity SDK in preview — a Python library that gives you programmatic access to Google's premier Antigravity coding agent. With the Antigravity SDK, you can prototype, build, and iterate on sophisticated agentic applications. Build on top of the Antigravity Agent Runtime with minimal code and explore and prototype novel agentic patterns with state-of-the-art primitives.
                - link "GitHub repo" [ref=e89] [cursor=pointer]:
                  - /url: https://github.com/google-antigravity/antigravity-sdk-python
              - heading "Powered by the Antigravity Runtime" [level=4] [ref=e92]
              - paragraph [ref=e95]:
                - text: The SDK gives you the same agent runtime that powers
                - link "Antigravity 2.0" [ref=e96] [cursor=pointer]:
                  - /url: https://antigravity.google/blog/introducing-google-antigravity-2-0
                - text: and the
                - link "Antigravity CLI" [ref=e97] [cursor=pointer]:
                  - /url: https://antigravity.google/blog/introducing-google-antigravity-cli
                - text: . Your agent inherits a capable execution environment — a rich built-in toolset, a declarative safety-policy engine, lifecycle hooks for observing and steering every tool call, and stateful multi-turn sessions that persist across interactions. With the Antigravity SDK, you extend the same harness used for Google's internal research with your own logic. As the Antigravity runtime improves — faster tool execution, smarter planning, better context management — those same improvements flow to your SDK agents automatically.
              - paragraph [ref=e100]:
                - text: Most developers only need
                - code [ref=e101]: Agent
