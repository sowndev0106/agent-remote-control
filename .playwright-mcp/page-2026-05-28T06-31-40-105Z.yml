                - code [ref=e120]: "import asyncio from google.antigravity import Agent, LocalAgentConfig async def main(): config = LocalAgentConfig() async with Agent(config) as agent: response = await agent.chat(\"What files are in the current directory?\") print(await response.text()) if __name__ == \"__main__\": asyncio.run(main())"
              - paragraph [ref=e123]: "Your agent logic is decoupled from where it runs: and soon you'll be able to swap the local agentic loop for a remotely-hosted one and the same agent will deploy to the cloud — no rewrite required. You focus on what the agent does. The SDK handles how and where it runs."
              - paragraph [ref=e126]: Every agent starts with a complete built-in toolset — file I/O, code editing, shell execution, directory search, image generation, and sub-agent delegation — ready at initialization. From there, layer in system instructions to set identity, add domain-specific guidance, or replace the defaults entirely.
              - heading "Built for AI-Native Development" [level=4] [ref=e129]
              - paragraph [ref=e132]: "The SDK is designed to be agent-friendly — for both the applications you build with it and how you build them. If you use Antigravity, you can ask the agent to write, test, and iterate on your SDK code directly within your development session. The API surface uses clean Python types (Pydantic V2 models, native Python collections), structured outputs, and clear naming conventions — all chosen so that AI agents can read, write, and maintain SDK code as fluently as human developers. The SDK is Antigravity's own API: the agent building your code understands the framework from the inside out."
              - heading "Governed Extensibility" [level=3] [ref=e135]
              - paragraph [ref=e138]: Customize your agent with your own Python functions, bind its output to your data types via structured output schemas, and control when and how tools are invoked.
              - heading "Tools and Integrations" [level=4] [ref=e141]
              - paragraph [ref=e144]: "The SDK supports four kinds of toolsets that all share one execution pipeline, one streaming infrastructure, and one set of safety policies:"
              - list [ref=e147]:
                - listitem [ref=e148]:
                  - strong [ref=e149]: Built-in tools
                  - text: — file I/O, code editing, shell execution, directory search, image generation, sub-agent delegation, and more.
                - listitem [ref=e150]:
                  - strong [ref=e151]: Custom Python functions
                  - text: — register any Python callable as a tool the agent can invoke.
                - listitem [ref=e152]:
                  - strong [ref=e153]: MCP servers
                  - text: — connect any
                  - link "Model Context Protocol" [ref=e154] [cursor=pointer]:
                    - /url: https://modelcontextprotocol.io/
                  - text: server (stdio, SSE, or Streamable HTTP) and expose its tools to the agent.
                - listitem [ref=e155]:
                  - strong [ref=e156]: Agent skills
                  - text: — provide paths to reusable skill packages of instructions, tools, and context via
                  - code [ref=e157]: skills_paths
                  - text: in the agent config.
              - paragraph [ref=e160]: Define a policy or hook once, and it governs every tool — regardless of its source.
              - heading "Safety Policies" [level=4] [ref=e163]
              - paragraph [ref=e166]:
                - text: Out of the box,
