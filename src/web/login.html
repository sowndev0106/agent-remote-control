<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>agent-remote-control — sign in</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0d10; color: #eaeef3;
         display: grid; place-items: center; min-height: 100vh; margin: 0; }
  form { background: #14181d; padding: 32px; border-radius: 8px;
         box-shadow: 0 4px 24px rgba(0,0,0,0.4); min-width: 320px; }
  h1 { margin: 0 0 16px; font-size: 18px; }
  label { display: block; font-size: 13px; color: #aab; }
  input { width: 100%; padding: 8px; margin-top: 8px;
          background: #0b0d10; color: #eaeef3; border: 1px solid #2a3038;
          border-radius: 4px; box-sizing: border-box; font-size: 14px; }
  button { margin-top: 16px; padding: 8px 16px; background: #2563eb;
           color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1d4ed8; }
  .err { color: #f87171; margin-top: 12px; min-height: 1em; font-size: 13px; }
  .footer { color: #6b7280; font-size: 11px; margin-top: 16px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Sign in to agent-remote-control</h1>
  <label>Password
    <input id="p" type="password" required autofocus autocomplete="current-password" />
  </label>
  <button type="submit">Sign in</button>
  <div class="err" id="e" role="alert"></div>
  <div class="footer">First run? Run <code>agent-remote-control install</code> in a terminal.</div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const e = document.getElementById("e"); e.textContent = "";
  const btn = ev.target.querySelector("button");
  btn.disabled = true;
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("p").value }),
    });
    const body = await r.json().catch(() => ({}));
    if (r.ok && body.ok) { location.href = "/"; return; }
    e.textContent = body?.error?.message || ("Sign-in failed (" + r.status + ")");
  } catch (err) {
    e.textContent = "Network error: " + (err && err.message || err);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
